services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      - mongodb
    env_file: .env
    # Inside the compose network MongoDB is the "mongodb" service.
    environment:
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
    # Only reachable from this machine.
    ports:
      - '127.0.0.1:${PORT}:${PORT}'
    volumes:
      - .:/app
      # Keeps the image's node_modules instead of the host's.
      - /app/node_modules

  mongodb:
    image: mongo:7
    restart: unless-stopped
    # Only reachable from this machine.
    ports:
      - '127.0.0.1:${MONGODB_PORT}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
